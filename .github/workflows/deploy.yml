name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "This deploy setup requires a Debian/Ubuntu server with apt-get." >&2
              exit 1
            fi
            if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1 || ! command -v nginx >/dev/null 2>&1 || ! command -v certbot >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2 nginx certbot python3-certbot-nginx
            fi
            systemctl enable --now docker

            if [ ! -d /opt/apps/opket.uz/.git ]; then
              if [ -e /opt/apps/opket.uz ]; then
                echo "The app path exists but is not a Git checkout; refusing to overwrite it." >&2
                exit 1
              fi
              mkdir -p /opt/apps
              git clone --branch main --depth 1 https://github.com/ibroheemov/opket-mini-app.git /opt/apps/opket.uz
            fi
            cd /opt/apps/opket.uz
            git pull --ff-only origin main
            docker build -t opket.uz:latest .
            docker compose up -d
            echo "Checking container status..."
            docker compose ps

            echo "Checking application..."
            curl -fsS -o /dev/null http://127.0.0.1:3000

            legacy_site_file=/etc/nginx/sites-available/opket.uz
            legacy_enabled_file=/etc/nginx/sites-enabled/opket.uz
            if [ -e "$legacy_enabled_file" ]; then
              if [ -L "$legacy_enabled_file" ] && [ "$(readlink -f "$legacy_enabled_file")" = "$legacy_site_file" ]; then
                rm "$legacy_enabled_file"
              else
                echo "Found a conflicting old Nginx site entry for opket.uz." >&2
                exit 1
              fi
            fi
            if [ -e "$legacy_site_file" ]; then
              if grep -Fq 'server_name opket.uz;' "$legacy_site_file" && grep -Fq 'proxy_pass http://127.0.0.1:3000;' "$legacy_site_file"; then
                rm "$legacy_site_file"
              else
                echo "Found an unrelated Nginx site config for opket.uz; refusing to remove it." >&2
                exit 1
              fi
            fi

            site_file=/etc/nginx/sites-available/opketme.uz
            enabled_file=/etc/nginx/sites-enabled/opketme.uz
            if [ ! -e "$site_file" ]; then
              cat > "$site_file" <<'NGINX'
            server {
              listen 80;
              server_name opketme.uz;

              location / {
                proxy_pass http://127.0.0.1:3000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
            }
            NGINX
            elif ! grep -Fq 'proxy_pass http://127.0.0.1:3000;' "$site_file"; then
              echo "Found an existing Nginx site config for opketme.uz; refusing to overwrite it." >&2
              exit 1
            fi

            if [ -L "$enabled_file" ]; then
              if [ "$(readlink -f "$enabled_file")" != "$site_file" ]; then
                echo "Found a conflicting Nginx site symlink for opketme.uz." >&2
                exit 1
              fi
            elif [ -e "$enabled_file" ]; then
              echo "Found an existing Nginx site entry for opketme.uz; refusing to overwrite it." >&2
              exit 1
            else
              ln -s "$site_file" "$enabled_file"
            fi

            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
              ufw allow 80/tcp
              ufw allow 443/tcp
            fi

            nginx -t
            systemctl enable --now nginx
            systemctl reload nginx

            if [ ! -f /etc/letsencrypt/live/opketme.uz/fullchain.pem ]; then
              certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email --redirect -d opketme.uz
            else
              certbot renew --quiet
            fi

            install -d -m 755 /etc/nginx/snippets
            cat > /etc/nginx/snippets/opketme-api.conf <<'NGINX'
            location = /api {
              proxy_pass http://127.0.0.1:4000/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/ {
              proxy_pass http://127.0.0.1:4000/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /socket.io/ {
              proxy_pass http://127.0.0.1:4000/socket.io/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 3600s;
              proxy_buffering off;
            }
            NGINX

            python3 - <<'PY'
            from pathlib import Path
            import re

            path = Path("/etc/nginx/sites-available/opketme.uz")
            text = path.read_text()
            include_line = "  include /etc/nginx/snippets/opketme-api.conf;"
            if include_line not in text:
                for match in re.finditer(r"(?m)^server\s*\{", text):
                    opening = text.find("{", match.start())
                    depth = 0
                    closing = None
                    for index in range(opening, len(text)):
                        if text[index] == "{":
                            depth += 1
                        elif text[index] == "}":
                            depth -= 1
                            if depth == 0:
                                closing = index + 1
                                break
                    if closing is None:
                        raise SystemExit("Unclosed Nginx server block.")
                    block = text[match.start():closing]
                    if "server_name opketme.uz;" not in block or not re.search(r"(?m)^\s*listen\s+443\s+ssl(?:\s|;)", block):
                        continue
                    location = re.search(r"(?m)^\s*location\s+/\s*\{", block)
                    if location is None:
                        raise SystemExit("HTTPS vhost has no SPA proxy location.")
                    block = block[:location.start()] + include_line + "\n" + block[location.start():]
                    text = text[:match.start()] + block + text[closing:]
                    break
                else:
                    raise SystemExit("Could not find the HTTPS vhost for opketme.uz.")
                path.write_text(text)
            PY

            nginx -t
            systemctl reload nginx
            curl -fsS -o /dev/null https://opketme.uz/
            curl -fsS -o /dev/null https://opketme.uz/api/health

            echo "Deployment verification successful!"
