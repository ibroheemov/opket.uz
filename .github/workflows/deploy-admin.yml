name: Deploy admin panel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out admin panel
        uses: actions/checkout@v4
        with:
          repository: ibroheemov/opket-admin-frontend
          ref: main
          path: admin-panel
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - name: Build admin panel
        working-directory: admin-panel
        run: npm ci && npm run build

      - name: Prepare admin web root
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "This deploy setup requires a Debian/Ubuntu server with apt-get." >&2
              exit 1
            fi
            if ! command -v nginx >/dev/null 2>&1 || ! command -v certbot >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y nginx certbot python3-certbot-nginx
            fi
            mkdir -p /var/www/admin.opketme.uz

      - name: Upload built admin panel
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: admin-panel/dist/*
          target: /var/www/admin.opketme.uz
          strip_components: 2
          overwrite: true

      - name: Configure Nginx and HTTPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            site_file=/etc/nginx/sites-available/admin.opketme.uz
            enabled_file=/etc/nginx/sites-enabled/admin.opketme.uz
            if [ ! -e "$site_file" ]; then
              cat > "$site_file" <<'NGINX'
            server {
              listen 80;
              server_name admin.opketme.uz;
              root /var/www/admin.opketme.uz;
              index index.html;

              location / {
                try_files $uri $uri/ /index.html;
              }
            }
            NGINX
            elif ! grep -Fq 'root /var/www/admin.opketme.uz;' "$site_file"; then
              echo "Found an existing Nginx site config for admin.opketme.uz; refusing to overwrite it." >&2
              exit 1
            fi

            if [ -L "$enabled_file" ]; then
              if [ "$(readlink -f "$enabled_file")" != "$site_file" ]; then
                echo "Found a conflicting Nginx site symlink for admin.opketme.uz." >&2
                exit 1
              fi
            elif [ -e "$enabled_file" ]; then
              echo "Found an existing Nginx site entry for admin.opketme.uz; refusing to overwrite it." >&2
              exit 1
            else
              ln -s "$site_file" "$enabled_file"
            fi

            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
              ufw allow 80/tcp
              ufw allow 443/tcp
            fi

            nginx -t
            systemctl enable --now nginx
            systemctl reload nginx

            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
              ufw allow 80/tcp
              ufw allow 443/tcp
            fi

            if [ ! -f /etc/letsencrypt/live/admin.opketme.uz/fullchain.pem ]; then
              certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email --redirect -d admin.opketme.uz
            else
              certbot renew --quiet
            fi

            install -d -m 755 /etc/nginx/snippets
            cat > /etc/nginx/snippets/admin-opketme-api.conf <<'NGINX'
            location = /api {
              proxy_pass http://127.0.0.1:4001/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/ {
              proxy_pass http://127.0.0.1:4001/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /socket.io/ {
              proxy_pass http://127.0.0.1:4001/socket.io/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 3600s;
              proxy_buffering off;
            }
            NGINX

            python3 - <<'PY'
            from pathlib import Path
            import re

            path = Path("/etc/nginx/sites-available/admin.opketme.uz")
            text = path.read_text()
            include_line = "  include /etc/nginx/snippets/admin-opketme-api.conf;"
            if include_line not in text:
                for match in re.finditer(r"(?m)^server\s*\{", text):
                    opening = text.find("{", match.start())
                    depth = 0
                    closing = None
                    for index in range(opening, len(text)):
                        if text[index] == "{":
                            depth += 1
                        elif text[index] == "}":
                            depth -= 1
                            if depth == 0:
                                closing = index + 1
                                break
                    if closing is None:
                        raise SystemExit("Unclosed Nginx server block.")
                    block = text[match.start():closing]
                    if "server_name admin.opketme.uz;" not in block or not re.search(r"(?m)^\s*listen\s+443\s+ssl(?:\s|;)", block):
                        continue
                    location = re.search(r"(?m)^\s*location\s+/\s*\{", block)
                    if location is None:
                        raise SystemExit("HTTPS vhost has no SPA location.")
                    block = block[:location.start()] + include_line + "\n" + block[location.start():]
                    text = text[:match.start()] + block + text[closing:]
                    break
                else:
                    raise SystemExit("Could not find the HTTPS vhost for admin.opketme.uz.")
                path.write_text(text)

            nginx -t
            systemctl reload nginx
            curl -fsS -o /dev/null https://admin.opketme.uz/
            curl -fsS -o /dev/null https://admin.opketme.uz/api/public/app-version-config/passenger
