name: Deploy admin panel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out admin panel
        uses: actions/checkout@v4
        with:
          repository: ibroheemov/opket-admin-frontend
          ref: main
          path: admin-panel
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - name: Build admin panel
        working-directory: admin-panel
        run: npm ci && npm run build

      - name: Prepare admin web root
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "This deploy setup requires a Debian/Ubuntu server with apt-get." >&2
              exit 1
            fi
            if ! command -v nginx >/dev/null 2>&1 || ! command -v certbot >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y nginx certbot python3-certbot-nginx
            fi
            mkdir -p /var/www/admin.opketme.uz

      - name: Upload built admin panel
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: admin-panel/dist/*
          target: /var/www/admin.opketme.uz
          strip_components: 2
          overwrite: true

      - name: Configure Nginx and HTTPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            site_file=/etc/nginx/sites-available/admin.opketme.uz
            enabled_file=/etc/nginx/sites-enabled/admin.opketme.uz
            if [ ! -e "$site_file" ]; then
              cat > "$site_file" <<'NGINX'
            server {
              listen 80;
              server_name admin.opketme.uz;
              root /var/www/admin.opketme.uz;
              index index.html;

              location / {
                try_files $uri $uri/ /index.html;
              }
            }
            NGINX
            elif ! grep -Fq 'root /var/www/admin.opketme.uz;' "$site_file"; then
              echo "Found an existing Nginx site config for admin.opketme.uz; refusing to overwrite it." >&2
              exit 1
            fi

            if [ -L "$enabled_file" ]; then
              if [ "$(readlink -f "$enabled_file")" != "$site_file" ]; then
                echo "Found a conflicting Nginx site symlink for admin.opketme.uz." >&2
                exit 1
              fi
            elif [ -e "$enabled_file" ]; then
              echo "Found an existing Nginx site entry for admin.opketme.uz; refusing to overwrite it." >&2
              exit 1
            else
              ln -s "$site_file" "$enabled_file"
            fi

            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
              ufw allow 80/tcp
              ufw allow 443/tcp
            fi

            nginx -t
            systemctl enable --now nginx
            systemctl reload nginx

            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
              ufw allow 80/tcp
              ufw allow 443/tcp
            fi

            if [ ! -f /etc/letsencrypt/live/admin.opketme.uz/fullchain.pem ]; then
              certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email --redirect -d admin.opketme.uz
            else
              certbot renew --quiet
            fi

            nginx -t
            systemctl reload nginx
            curl -fsS -o /dev/null https://admin.opketme.uz/
